name: CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Backend Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: ai_interview_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        working-directory: ./AI-Interview-Intelligence/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Backend Tests
        working-directory: ./AI-Interview-Intelligence/backend
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/ai_interview_test
          SECRET_KEY: test-secret-key-32-characters-long-12345
          ENV: development
        run: |
          python -m unittest discover tests

  frontend-build:
    name: Frontend Build & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: './AI-Interview-Intelligence/frontend/package.json'

      - name: Install Frontend Dependencies
        working-directory: ./AI-Interview-Intelligence/frontend
        run: npm ci || npm install

      - name: Build Frontend
        working-directory: ./AI-Interview-Intelligence/frontend
        run: npm run build
